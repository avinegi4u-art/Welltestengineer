<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Well Test Program Commander — Integrated Operations</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307111f'/%3E%3Cpath d='M32 8v48M8 32h48' stroke='%233dd7b6' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='10' fill='%2363a7ff'/%3E%3C/svg%3E" />
  <style>
    :root, [data-theme="dark"] {
      --bg: #07111f; --surface: #0d1b2d; --surface-2: #122238; --surface-3: #172b45;
      --border: #29445f; --text: #eef5ff; --muted: #a9bad0;
      --accent: #3dd7b6; --accent-2: #63a7ff; --warn: #ffba66; --bad: #ff7b8a; --good: #7ee787;
      --radius: 14px; --shadow: 0 12px 40px rgba(0,0,0,.35);
    }
    [data-theme="light"] {
      --bg: #f7f6f2; --surface: #fff; --surface-2: #f9f8f5; --surface-3: #edeae5;
      --border: #d4d1ca; --text: #28251d; --muted: #6f6d67;
      --accent: #01696f; --accent-2: #3d5a80; --warn: #964219; --bad: #a12c3c; --good: #437a22;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; border: 1px solid var(--border); background: var(--surface-2); border-radius: 999px; padding: .6rem 1rem; }
    button:hover { border-color: var(--accent); }
    button.primary { background: linear-gradient(135deg, var(--accent), #238fb5); color: #03131b; border: 0; font-weight: 700; }
    .layout { display: grid; grid-template-columns: 300px 1fr; min-height: 100vh; }
    @media (max-width: 960px) { .layout { grid-template-columns: 1fr; } .sidebar { position: static !important; height: auto !important; } }
    .sidebar {
      position: sticky; top: 0; height: 100vh; overflow: auto;
      background: var(--surface); border-right: 1px solid var(--border); padding: 1rem;
    }
    .brand { display: flex; gap: .75rem; align-items: center; margin-bottom: 1rem; }
    .logo { width: 40px; height: 40px; border-radius: 10px; background: var(--surface-3); display: grid; place-items: center; border: 1px solid var(--border); }
    h1 { font-size: 1.05rem; margin: 0; line-height: 1.2; }
    .sub { font-size: .78rem; color: var(--muted); margin: .2rem 0 0; }
    .nav-group { margin: .75rem 0; }
    .nav-group-title { font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: .5rem 0 .35rem; }
    .nav-btn {
      display: block; width: 100%; text-align: left; border-radius: 8px; padding: .45rem .6rem;
      margin-bottom: 2px; background: transparent; border: 0; font-size: .82rem; color: var(--muted);
    }
    .nav-btn:hover, .nav-btn.active { background: var(--surface-3); color: var(--text); }
    .nav-btn.active { border-left: 3px solid var(--accent); }
    .main { padding: 1.25rem; max-width: 1200px; }
    .top-actions { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; margin-bottom: 1rem; box-shadow: var(--shadow); }
    .panel h2 { margin: 0 0 .35rem; font-size: 1.35rem; }
    .panel h3 { margin: 1rem 0 .35rem; font-size: 1rem; color: var(--accent); }
    .panel h4 { margin: .75rem 0 .25rem; font-size: .92rem; }
    .muted { color: var(--muted); font-size: .88rem; line-height: 1.55; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: .75rem; margin-top: .75rem; }
    .field { display: flex; flex-direction: column; gap: .25rem; }
    .field label { font-size: .78rem; font-weight: 600; color: var(--muted); }
    .field input, .field select, .field textarea {
      padding: .65rem .75rem; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2);
    }
    .field textarea { min-height: 80px; resize: vertical; }
    .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: .75rem; margin: .75rem 0; }
    .kpi { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: .85rem; }
    .kpi .lbl { font-size: .68rem; text-transform: uppercase; color: var(--muted); }
    .kpi .val { font-size: 1.4rem; font-weight: 700; margin-top: .2rem; }
    table { width: 100%; border-collapse: collapse; font-size: .84rem; margin-top: .5rem; }
    th, td { padding: .55rem .6rem; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
    th { color: var(--muted); font-weight: 600; }
    .badge { display: inline-block; padding: .15rem .5rem; border-radius: 999px; font-size: .72rem; font-weight: 700; }
    .badge.pending { background: rgba(255,186,102,.2); color: var(--warn); }
    .badge.pass { background: rgba(126,231,135,.15); color: var(--good); }
    .badge.block { background: rgba(255,123,138,.15); color: var(--bad); }
    .callout { border-left: 3px solid var(--accent); padding: .75rem 1rem; background: var(--surface-2); border-radius: 0 8px 8px 0; margin: .75rem 0; font-size: .88rem; }
    .callout.warn { border-color: var(--warn); }
    .callout.bad { border-color: var(--bad); }
    .tool-links { display: flex; flex-wrap: wrap; gap: .5rem; margin: .75rem 0; }
    .tool-links a {
      text-decoration: none; color: var(--text); border: 1px solid var(--border);
      padding: .45rem .75rem; border-radius: 999px; font-size: .82rem; background: var(--surface-2);
    }
    .tool-links a:hover { border-color: var(--accent-2); }
    .step-list { list-style: none; padding: 0; margin: 0; }
    .step-item {
      display: grid; grid-template-columns: auto 1fr auto; gap: .75rem; align-items: start;
      padding: .75rem; border: 1px solid var(--border); border-radius: 10px; margin-bottom: .5rem; background: var(--surface-2);
    }
    .step-item.done { border-color: var(--good); opacity: .85; }
    .step-num { width: 28px; height: 28px; border-radius: 50%; background: var(--surface-3); display: grid; place-items: center; font-size: .78rem; font-weight: 700; }
    .step-title { font-weight: 600; font-size: .9rem; }
    .step-detail { font-size: .82rem; color: var(--muted); margin-top: .25rem; line-height: 1.45; }
    .section-view { display: none; }
    .section-view.active { display: block; }
    .progress-bar { height: 8px; background: var(--surface-3); border-radius: 999px; overflow: hidden; margin: .5rem 0; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .3s; }
    .hidden { display: none !important; }
    @media print { .sidebar, .top-actions { display: none; } .layout { grid-template-columns: 1fr; } .section-view { display: block !important; page-break-inside: avoid; } }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo" aria-hidden="true">⛽</div>
        <div>
          <h1>WTP Commander</h1>
          <p class="sub">Multi-DST integrated operations</p>
        </div>
      </div>
      <div id="navRoot"></div>
    </aside>
    <main class="main">
      <div class="top-actions">
        <button id="themeBtn">Light mode</button>
        <button id="saveBtn" class="primary">Save program</button>
        <button id="exportBtn">Export JSON</button>
        <button id="importBtn">Import JSON</button>
        <input type="file" id="importFile" accept=".json,application/json" class="hidden" />
        <button id="printBtn">Print / PDF</button>
      </div>
      <div id="contentRoot"></div>
    </main>
  </div>

  <script>
    const STORAGE_KEY = 'wtp-commander-v1';
    const HYD = 0.052;
    const FT_PER_M = 3.280839895;

    const PROGRAM = {
      meta: {
        title: 'Multi-Zone DST Well Test Program',
        formations: ['LK-3', 'KH-2', 'MISHRIF'],
        dstRuns: ['DST 1 — LK-3', 'DST 2 — KH-2', 'DST 3 — MISHRIF'],
      },
      sections: [
        { id: 's1', num: '1', title: 'INTRODUCTION', children: [
          { id: 's1-1', num: '1.1', title: 'Well History' },
          { id: 's1-2', num: '1.2', title: 'Purpose and Outline of the Program' },
          { id: 's1-3', num: '1.3', title: 'Well Testing Objectives' },
          { id: 's1-4', num: '1.4', title: 'Reference Documents and Procedures' },
          { id: 's1-5', num: '1.5', title: 'Personnel and Responsibilities' },
          { id: 's1-6', num: '1.6', title: 'Safety Expectations' },
          { id: 's1-7', num: '1.7', title: 'Operating Practices' },
          { id: 's1-8', num: '1.8', title: 'Changes to the Well Test Program' },
          { id: 's1-9', num: '1.9', title: 'Shift Handover Process' },
        ]},
        { id: 's2', num: '2', title: 'WELL INFORMATION', children: [
          { id: 's2-1', num: '2.1', title: 'General Data' },
          { id: 's2-2', num: '2.2', title: 'Well Schematics' },
          { id: 's2-3', num: '2.3', title: 'Expected Reservoir Pressure & Temperature' },
          { id: 's2-4', num: '2.4', title: 'Preliminary Data Gathering Program and TD Criteria' },
          { id: 's2-5', num: '2.5', title: 'Dimensions and Volumes' },
          { id: 's2-6', num: '2.6', title: 'Proposed Perforation Intervals' },
          { id: 's2-7', num: '2.7', title: 'PVT & Surface Sampling Requirements' },
          { id: 's2-8', num: '2.8', title: 'Real Time Requirements' },
          { id: 's2-9', num: '2.9', title: 'Brine Density Calculations' },
        ]},
        { id: 's3', num: '3', title: 'EQUIPMENT PREPARATION', children: [
          { id: 's3-1', num: '3.1', title: 'Drilling' },
          { id: 's3-2', num: '3.2', title: 'Well Test Package Preparation' },
          { id: 's3-3', num: '3.3', title: 'Wireline Preparation' },
          { id: 's3-4', num: '3.4', title: 'Test String Preparation' },
          { id: 's3-5', num: '3.5', title: 'Acid Recipes' },
          { id: 's3-6', num: '3.6', title: 'Service Company Contacts' },
        ]},
        { id: 's4', num: '4', title: 'DST PROCEDURE (DST 1: LK-3)', children: [
          { id: 's4-1', num: '4.1', title: 'Scraper Trip' },
          { id: 's4-2', num: '4.2', title: 'Dummy Run for EZ-Valve Space out' },
          { id: 's4-3', num: '4.3', title: 'Flex Trip' },
          { id: 's4-4', num: '4.4', title: 'Cased Hole Logging' },
          { id: 's4-5', num: '4.5', title: 'Wireline Perforation' },
          { id: 's4-6', num: '4.6', title: 'DST Operations (DST 1)' },
        ]},
        { id: 's5', num: '5', title: 'WELL KILL AND POOH (DST 1)' },
        { id: 's6', num: '6', title: 'CONTINGENCY DURING DST OPERATIONS' },
        { id: 's7', num: '7', title: 'ISOLATION / P&A OF DST 1' },
        { id: 's8', num: '8', title: 'WIRELINE PERFORATION (DST 2: KH-2)' },
        { id: 's9', num: '9', title: 'DST OPERATIONS (DST 2: KH-2)' },
        { id: 's10', num: '10', title: 'WELL KILLING AND POOH (DST 2)' },
        { id: 's11', num: '11', title: 'CONTINGENCY (DST 2)' },
        { id: 's12', num: '12', title: 'ISOLATION / P&A OF DST 2 & 7" LINER' },
        { id: 's13', num: '13', title: 'WIRELINE PERFORATION (DST 3: MISHRIF)' },
        { id: 's14', num: '14', title: 'DST OPERATIONS (DST 3: MISHRIF)' },
        { id: 's15', num: '15', title: 'WELL KILLING AND POOH (DST 3)' },
        { id: 's16', num: '16', title: 'CONTINGENCY (DST 3)' },
        { id: 's17', num: '17', title: 'ISOLATION OF MISHRIF AND WELL P&A' },
        { id: 's18', num: '18', title: 'ROLES AND RESPONSIBILITIES' },
        { id: 's19', num: '19', title: 'WELL TEST REPORTING' },
        { id: 's20', num: '20', title: 'DST TOOL CONTINGENCIES' },
        { id: 's21', num: '21', title: 'APPENDIX' },
      ],
    };

    const DST1_STEPS = [
      { id: 'd1-prior', title: 'Considerations prior RIH DST string', detail: 'Verify BHA tally, gauge settings, EZ-valve space-out, HPPK/CERTIS ratings, metallurgy (H₂S), and SIMOPS with CT/wireline. Confirm kill weight fluid in hole and barrier diagram signed.', gate: 'G3' },
      { id: 'd1-gauge', title: 'DST downhole gauge setting', detail: 'Memory gauges: sample rate 1–10 s during flow/buildup; pre-job time sync; shock rating for perforating/TCP; battery life > planned test + 24 hr margin.', gate: 'G3' },
      { id: 'd1-bha', title: 'Make up DST BHA', detail: 'Torque/standoff per DS; drift all IDs; record serial numbers; IRDV, SHRV, EZ-valve orientation; weak point calculation documented.', tools: ['dst-bha-tally-app.html'] },
      { id: 'd1-rih', title: 'RIH on 3½" #15.8 BTS-6 tubing per approved tally', detail: 'Fill pipe every 10 stands; monitor drag; no rotation unless approved; tally vs marker joint for packer depth.', tools: ['dst-bha-tally-app.html'] },
      { id: 'd1-corr', title: 'Wireline correlation & DST space-out', detail: 'GR/CCL vs open-hole/cased-hole log; adjust space-out for EZ-valve landing; second engineer verify depth.', gate: 'G3' },
      { id: 'd1-landing', title: 'Make up Landing String Assembly', detail: 'Landing nipple profile verified; latch-in test if required; hang-off weight calculated.', },
      { id: 'd1-packer', title: 'Set SLB CERTIS Packer', detail: 'Set depth per correlation; packer setting weight/pressure; test seal below/above per program; max differential documented.', gate: 'G3' },
      { id: 'd1-rigup', title: 'Rig up Flowhead, Scaffolding, CT (TBC) and pressure test', detail: 'Flowhead + IRDV alignment; test to 1.2× MAWOP; ESD functional; CT rig-up if contingency planned.', gate: 'G1' },
      { id: 'd1-displace', title: 'Displace DST string with fresh water / diesel', detail: 'Track volumes; confirm clean fluid at tester valve; avoid underbalance before intentional flow.', },
      { id: 'd1-inject', title: 'Injectivity test through DST string', detail: 'Low rate injection; record ISIP, falloff; verify communication with perf interval; max pressure < fracture gradient.', gate: 'G4' },
      { id: 'd1-acid', title: 'Acid Stimulation', detail: 'Stage volumes/rates per acid recipe; real-time WHP; inhibitor for Tres; overflush volume; soak time before flowback.', tools: ['acid-calculator-v5.html'], gate: 'G8' },
      { id: 'd1-cleanup', title: 'Cleanup, Flow Test and Sampling', detail: 'Initial cleanup until sand/water cut stable; then allocation-quality flow.', gate: 'G5' },
      { id: 'd1-ibu24', title: 'Initial buildup 24 hr (stabilized WHP per COSMO-RE)', detail: 'Close tester valve; monitor WHP stabilization; min 24 hr or until derivative flat; RT data to office.', gate: 'G6' },
      { id: 'd1-choke', title: 'Flow test — 16/64", 24/64", 32/64" choke steps', detail: 'Stabilize each bean ≥ program duration; record separator P/T, rates, GOR; IPR points for deliverability.', gate: 'G5' },
      { id: 'd1-surf', title: 'Surface fluid sampling', detail: 'Recombined separator sample after stabilization; gas spot + extended GC; pressurized oil sample; water ion chromatography.', gate: 'G5' },
      { id: 'd1-bhs', title: 'Bottomhole fluid sampling', detail: 'Wireline or DST sample bottle at Pwf; record drawdown, shut-in time, bottle P/T; single-phase maintenance.', },
      { id: 'd1-bbu', title: 'Bottomhole buildup 36–48 hr', detail: 'Extended buildup for PTA; import gauges to PTA Pro; superposition if multi-rate preceding flow.', tools: ['dst-pressure-transient-analysis-pro-v2.11.html'], gate: 'G6' },
    ];

    const KILL_STEPS = [
      { id: 'k1', title: 'Determine kill parameters', detail: 'Kill MW from vertical kill sheet; dynamic kill if flowing; overbalance 200–500 psi minimum.', tools: ['vertical-kill-sheet-app.html'] },
      { id: 'k2', title: 'Prepare kill fluid', detail: 'Mix to target density; viscosifier/LCM if losses expected; volume = string + annulus + 1.5 bbl safety.' },
      { id: 'k3', title: 'Loss Control Material (LCM)', detail: 'Have LCM pill staged if partial losses on circulation; max pill size per casing ID.' },
      { id: 'k4', title: 'Cycle IRDV to circulating position', detail: 'Follow SLB procedure; confirm pressure signature; no trapped pressure above tool.' },
      { id: 'k5', title: 'Confirm circulating position & reverse out', detail: 'Establish circulation; monitor returns; cut hydrocarbons before heavy kill if required.' },
      { id: 'k6', title: 'Cycle IRDV to well test position — lock open', detail: 'Lock-open for POOH; verify flow path clear.' },
      { id: 'k7', title: 'Close valves & flush lines', detail: 'Depressurize flowhead; bleed to closed drain; H₂S monitoring.' },
      { id: 'k8', title: 'Rig down scaffolding & lay out flowhead', detail: 'Verify LOTO; barrier register updated.' },
      { id: 'k9', title: 'Make up well control crossover', detail: 'BOP line-up for tubing circulation; pressure test.' },
      { id: 'k10', title: 'Pressure test', detail: 'Test to program pressure; hold 10 min; chart record.' },
      { id: 'k11', title: 'Top fill string', detail: 'Fill tubing before opening rams; prevent swabbing.' },
      { id: 'k12', title: 'Open lower pipe rams', detail: 'Controlled; monitor for flow.' },
      { id: 'k13', title: 'Unseat packer', detail: 'Overpull/rotate per CERTIS spec; max pull within weak point.' },
      { id: 'k14', title: 'Circulate well', detail: 'Kill to surface; verify static MW in/out.' },
      { id: 'k15', title: 'Lay down EZ-valve assy, POOH DST string', detail: 'Gauge download; BHA inspection; tally as-run.' },
    ];

    const CONTINGENCIES = [
      { id: 'c1', title: 'CT N₂ lift operation', detail: 'Unloading calculator; batch vs continuous N₂; WHP/CP limits; transition to natural flow; GC confirms formation gas.', ref: '21.8–21.10' },
      { id: 'c2', title: 'PLT operation', detail: 'Spinner + pressure/temp logs; QC velocity; align with choke steps for allocation.' },
      { id: 'c3', title: 'Fishing — retrieve DST BHA (HPPK) with SLB retrieval tool', detail: 'Jars, backoff, chemical cutter sequence; max fish length; well control during fishing.' },
      { id: 'c4', title: 'Wireline tubing puncture / cutter — stuck BHA/packer', detail: 'Separate procedure; depth correlation; explosive/chemical cutter selection; kill before cut if required.' },
    ];

    const ROLES = [
      { role: 'Sr Well Test Engineer', resp: 'Program owner, gate sign-off, PTA interpretation, SIMOPS, changes to WTP' },
      { role: 'Company Man / RE', resp: 'COSMO-RE WHP stabilization approval, well integrity, liaison with office' },
      { role: 'DST Supervisor (SLB/EXPRO)', resp: 'BHA makeup, tool operation, IRDV cycles, gauge QC' },
      { role: 'Well Test Supervisor', resp: 'Surface package, separator, metering, sampling, flaring' },
      { role: 'Wireline Supervisor', resp: 'Perforation, correlation, BH sampling, cutter/puncher' },
      { role: 'Stimulation Engineer', resp: 'Acid recipe, stage execution, returns analysis' },
      { role: 'CT Supervisor', detail: 'CT/N₂ contingency, cleanout, lift operations' },
      { role: 'Rig Toolpusher / Driller', resp: 'RIH/POOH, space-out, well control, BOP' },
      { role: 'HSE Lead', resp: 'PTW, gas testing, muster, H₂S contingency' },
    ];

    let state = loadState();
    let activeSection = 's1-1';

    function defaultState() {
      return {
        well: {
          name: '', field: '', rig: '', uwi: '', spudDate: '', tdMd: '', tdTvd: '',
          datum: 'RKB', waterDepth: '', latLong: '',
          customer: '', engineer: '', programRev: 'Rev 0',
        },
        reservoir: {
          lk3: { pi: '', temp: '', fluid: 'oil/gas', note: '' },
          kh2: { pi: '', temp: '', fluid: '', note: '' },
          mishrif: { pi: '', temp: '', fluid: '', note: '' },
        },
        brine: { naclWtPct: 10, tempF: 77, targetPpg: 10.0 },
        perf: [
          { dst: 'DST 1', formation: 'LK-3', topMd: '', botMd: '', shotsFt: '', underbalance: '' },
          { dst: 'DST 2', formation: 'KH-2', topMd: '', botMd: '', shotsFt: '', underbalance: '' },
          { dst: 'DST 3', formation: 'MISHRIF', topMd: '', botMd: '', shotsFt: '', underbalance: '' },
        ],
        steps: {},
        gates: {},
        valveBoard: [
          { tag: 'Master Valves', status: 'closed', note: '' },
          { tag: 'Wing Valve', status: 'closed', note: '' },
          { tag: 'Choke Manifold', status: 'closed', note: '' },
          { tag: 'IRDV', status: 'test', note: '' },
          { tag: 'ESD', status: 'armed', note: '' },
        ],
        shiftLog: [],
        references: [
          'Company Well Test Procedure',
          'API RP 59 / RP 60 — well control & testing',
          'SLB CERTIS Packer manual',
          'IRDV / EZ-valve operating manual',
          'Acid stimulation MSDS & inhibitor spec',
        ],
        notes: {},
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return { ...defaultState(), ...JSON.parse(raw) };
      } catch (_) { /* ignore */ }
      return defaultState();
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function initSteps() {
      [...DST1_STEPS, ...KILL_STEPS].forEach(s => {
        if (!state.steps[s.id]) state.steps[s.id] = { done: false, signedBy: '', signedAt: '', comment: '' };
      });
    }

    function brineDensityPpg(naclWtPct, tempF) {
      const T = (tempF - 32) / 1.8;
      const wt = naclWtPct / 100;
      const rhoKgm3 = 997 + 700 * wt + 0.2 * wt * (T - 25);
      return rhoKgm3 / 119.826;
    }

    function hydroPsi(ppg, tvdFt) {
      return ppg * HYD * tvdFt;
    }

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    function renderNav() {
      const root = document.getElementById('navRoot');
      root.innerHTML = PROGRAM.sections.map(sec => {
        if (sec.children) {
          const childBtns = sec.children.map(c =>
            `<button class="nav-btn${activeSection === c.id ? ' active' : ''}" data-nav="${c.id}">${esc(c.num)} ${esc(c.title)}</button>`
          ).join('');
          return `<div class="nav-group"><div class="nav-group-title">${esc(sec.num)} ${esc(sec.title)}</div>${childBtns}</div>`;
        }
        return `<div class="nav-group"><button class="nav-btn${activeSection === sec.id ? ' active' : ''}" data-nav="${sec.id}">${esc(sec.num)} ${esc(sec.title)}</button></div>`;
      }).join('');
      root.querySelectorAll('[data-nav]').forEach(btn => {
        btn.addEventListener('click', () => { activeSection = btn.dataset.nav; renderAll(); });
      });
    }

    function stepProgress(ids) {
      const total = ids.length;
      const done = ids.filter(id => state.steps[id]?.done).length;
      return { done, total, pct: total ? Math.round((done / total) * 100) : 0 };
    }

    function renderStepList(steps, prefix) {
      return `<ul class="step-list">${steps.map((s, i) => {
        const st = state.steps[s.id] || { done: false, signedBy: '', comment: '' };
        const tools = (s.tools || []).map(t => `<a href="${esc(t)}" target="_blank" rel="noopener">${esc(t.replace('.html',''))}</a>`).join(' ');
        return `<li class="step-item${st.done ? ' done' : ''}" data-step="${esc(s.id)}">
          <div class="step-num">${i + 1}</div>
          <div>
            <div class="step-title">${esc(s.title)} ${s.gate ? `<span class="badge pending">${esc(s.gate)}</span>` : ''}</div>
            <div class="step-detail">${esc(s.detail)}</div>
            ${tools ? `<div class="tool-links">${tools}</div>` : ''}
            <div class="grid" style="margin-top:.5rem">
              <div class="field"><label>Signed by</label><input data-step-field="signedBy" data-step-id="${esc(s.id)}" value="${esc(st.signedBy)}" /></div>
              <div class="field"><label>Comment</label><input data-step-field="comment" data-step-id="${esc(s.id)}" value="${esc(st.comment)}" /></div>
            </div>
          </div>
          <div><input type="checkbox" data-step-check="${esc(s.id)}" ${st.done ? 'checked' : ''} title="Mark complete" /></div>
        </li>`;
      }).join('')}</ul>`;
    }

    function field(label, path, value) {
      return `<div class="field"><label>${esc(label)}</label><input data-bind="${esc(path)}" value="${esc(value)}" /></div>`;
    }

    function findSection(id) {
      for (const sec of PROGRAM.sections) {
        if (sec.id === id) return sec;
        if (sec.children) {
          const c = sec.children.find(x => x.id === id);
          if (c) return c;
        }
      }
      return null;
    }

    function renderShiftLog() {
      if (!state.shiftLog.length) return '<p class="muted">No shift entries yet.</p>';
      return `<table><tr><th>Time</th><th>Outgoing</th><th>Incoming</th><th>Summary</th></tr>
        ${state.shiftLog.map(e => `<tr><td>${esc(e.time)}</td><td>${esc(e.out)}</td><td>${esc(e.in)}</td><td>${esc(e.summary)}</td></tr>`).join('')}
      </table>`;
    }

    function renderContent() {
      document.getElementById('contentRoot').innerHTML = `<div class="section-view active">${sectionContent(activeSection)}</div>`;
      bindEvents();
    }

    function bindEvents() {
      document.querySelectorAll('[data-bind]').forEach(el => {
        el.addEventListener('input', () => {
          setPath(state, el.dataset.bind, el.value);
          saveState();
        });
      });
      document.querySelectorAll('[data-res]').forEach(el => {
        el.addEventListener('input', () => {
          const [k, f] = el.dataset.res.split('.');
          state.reservoir[k][f] = el.value;
          saveState();
        });
      });
      document.querySelectorAll('[data-perf]').forEach(el => {
        el.addEventListener('input', () => {
          const [i, f] = el.dataset.perf.split('.');
          state.perf[+i][f] = el.value;
          saveState();
        });
      });
      document.querySelectorAll('[data-valve]').forEach(el => {
        el.addEventListener('input', () => {
          const [i, f] = el.dataset.valve.split('.');
          state.valveBoard[+i][f] = el.value;
          saveState();
        });
        el.addEventListener('change', () => {
          const [i, f] = el.dataset.valve.split('.');
          state.valveBoard[+i][f] = el.value;
          saveState();
        });
      });
      document.querySelectorAll('[data-step-check]').forEach(el => {
        el.addEventListener('change', () => {
          const id = el.dataset.stepCheck;
          state.steps[id].done = el.checked;
          if (el.checked && !state.steps[id].signedAt) {
            state.steps[id].signedAt = new Date().toISOString();
          }
          saveState();
          renderContent();
        });
      });
      document.querySelectorAll('[data-step-field]').forEach(el => {
        el.addEventListener('input', () => {
          const id = el.dataset.stepId;
          state.steps[id][el.dataset.stepField] = el.value;
          saveState();
        });
      });
      const nacl = document.getElementById('brineNacl');
      const temp = document.getElementById('brineTemp');
      const target = document.getElementById('brineTarget');
      if (nacl) {
        const upd = () => {
          state.brine.naclWtPct = +nacl.value;
          state.brine.tempF = +temp.value;
          state.brine.targetPpg = +target.value;
          saveState();
          renderContent();
        };
        nacl.addEventListener('input', upd);
        temp.addEventListener('input', upd);
        target.addEventListener('input', upd);
      }
      const addShift = document.getElementById('addShiftBtn');
      if (addShift) {
        addShift.addEventListener('click', () => {
          const summary = prompt('Handover summary (operation, WHP, hazards):');
          if (summary === null) return;
          state.shiftLog.unshift({
            time: new Date().toLocaleString(),
            out: prompt('Outgoing (name/role):') || '',
            in: prompt('Incoming (name/role):') || '',
            summary,
          });
          saveState();
          renderContent();
        });
      }
    }

    function setPath(obj, path, value) {
      const parts = path.split('.');
      let cur = obj;
      for (let i = 0; i < parts.length - 1; i++) {
        if (!cur[parts[i]]) cur[parts[i]] = {};
        cur = cur[parts[i]];
      }
      cur[parts[parts.length - 1]] = value;
    }

    function renderAll() {
      renderNav();
      renderContent();
    }

    document.getElementById('themeBtn').addEventListener('click', () => {
      const html = document.documentElement;
      const next = html.dataset.theme === 'dark' ? 'light' : 'dark';
      html.dataset.theme = next;
      document.getElementById('themeBtn').textContent = next === 'dark' ? 'Light mode' : 'Dark mode';
    });
    document.getElementById('saveBtn').addEventListener('click', () => { saveState(); alert('Program saved locally.'); });
    document.getElementById('exportBtn').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `wtp-${state.well.name || 'program'}.json`;
      a.click();
    });
    document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());
    document.getElementById('importFile').addEventListener('change', e => {
      const f = e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          state = { ...defaultState(), ...JSON.parse(r.result) };
          initSteps();
          saveState();
          renderAll();
        } catch (err) { alert('Invalid JSON'); }
      };
      r.readAsText(f);
    });
    document.getElementById('printBtn').addEventListener('click', () => window.print());

    initSteps();
    renderAll();
  </script>
</body>
</html>
