[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "defluffer"
version = "1.0.0"
description = "Local prompt defluffer — strip fluff/filler to cut LLM token usage"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Welltestengineer contributors" }]
keywords = ["llm", "prompt", "compression", "tokens", "defluffer"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
defluffer = "defluffer.cli:main"

[project.urls]
Homepage = "https://github.com/avinegi4u-art/Welltestengineer"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
