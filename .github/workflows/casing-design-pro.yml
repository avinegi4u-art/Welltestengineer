name: Casing Design Pro CI

on:
  push:
    paths:
      - 'casing-design-pro/**'
      - '.github/workflows/casing-design-pro.yml'
  pull_request:
    paths:
      - 'casing-design-pro/**'
      - '.github/workflows/casing-design-pro.yml'

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: casing-design-pro/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: casing-design-pro/backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run pytest
        run: pytest tests/ -v --tb=short
